name: Kondate CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: python -m unittest discover -s tests -v
        working-directory: backend
      - run: python example_search.py
        working-directory: backend

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Mobile
        run: |
          cd apps/mobile
          flutter pub get
          flutter analyze
          flutter test

      - name: Core
        run: |
          cd packages/core
          flutter pub get
          flutter analyze
          flutter test

      - name: Recipe Parser
        run: |
          cd packages/recipe_parser
          flutter pub get
          flutter analyze
          flutter test
